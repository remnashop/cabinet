name: Cabinet - Release

on:
  release:
    # a full release fires both published and released; a pre-release only published,
    # and its later promotion only released
    types: [published, released]

permissions: {}

jobs:
  checks:
    if: github.event.action == 'released' || github.event.release.prerelease
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🧾 Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: 🛠️ Set Up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the image keeps the remnashop-cabinet name the docs install from, not the repo's;
      # a pre-release gets only its own tag: latest stays on the last full release
      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/remnashop/remnashop-cabinet:${{ github.ref_name }}
            ${{ !github.event.release.prerelease && 'ghcr.io/remnashop/remnashop-cabinet:latest' || '' }}

  release:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write

    steps:
      - name: 🧾 Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🔖 Get previous tag
        id: latest-tag
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          echo "previousTag=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT
          echo "latestTag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: 📦 Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            # 🛍 Remnashop Cabinet ${{ github.ref_name }}
            [![Telegram Group](https://img.shields.io/badge/public_group-white?style=social&logo=Telegram&logoColor=blue)](https://t.me/remna_shop)
            [![Remnawave](https://img.shields.io/badge/remnawave-white?style=social&logo=Telegram&logoColor=blue)](https://t.me/+xQs17zMzwCY1NzYy)

            ---

            - [Compare changes (${{ steps.latest-tag.outputs.previousTag }}...${{ steps.latest-tag.outputs.latestTag }})](https://github.com/remnashop/cabinet/compare/${{ steps.latest-tag.outputs.previousTag }}...${{ steps.latest-tag.outputs.latestTag }})
            - Works with the Remnashop version of the same number: [compatibility](https://remnashop.dev/docs/getting-started/requirements)

            ---

            ## 🐳 Docker Image

            ```
            ${{ !github.event.release.prerelease && 'ghcr.io/remnashop/remnashop-cabinet:latest' || '' }}
            ghcr.io/remnashop/remnashop-cabinet:${{ github.ref_name }}
            ```
          draft: false
          prerelease: ${{ github.event.release.prerelease }}
