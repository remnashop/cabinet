server {
    listen 80;
    root /usr/share/nginx/html;

    # hashed file names: a new build gets new URLs
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # written at container start from API_URL
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # SPA: every route is index.html, never cached so a deploy is picked up
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
